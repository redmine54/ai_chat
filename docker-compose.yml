services:
  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./src/frontend:/usr/share/nginx/html
      - ./src/frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  backend:
    build:
      context: . # プロジェクトルートをコンテキストに
      dockerfile: src/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CHROMA_HOST=vectordb
      - CHROMA_PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    depends_on:
      - vectordb
    volumes:
      # backend のコードを丸ごと /app にマウント（最重要）
      - ./src/backend:/app

      # 以下は /app 内の特定フォルダを上書きする
      - ./requirements.txt:/app/requirements.txt
      - ./docs:/app/docs
      - ./src/backend/data:/app/data
      - ./src/backend/templates:/app/templates

    #  - chroma-persistent:/app/chroma   # PersistentClient用ボリューム追加
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 300

  vectordb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

volumes:
  chroma-data:
  #chroma-persistent:   # PersistentClient用ボリューム追加
