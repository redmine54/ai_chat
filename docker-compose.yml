services:
  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./src/frontend:/usr/share/nginx/html
      - ./src/frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  backend:
    build:
      context: . # プロジェクトルートをコンテキストに
      dockerfile: src/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CHROMA_HOST=vectordb
      - CHROMA_PORT=8000
    depends_on:
      - vectordb
    volumes:
      - ./docs:/app/docs
      - ./README.md:/app/README.md
      - ./src/backend/templates:/app/templates

  vectordb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

volumes:
  chroma-data:
