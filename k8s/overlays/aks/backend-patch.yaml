apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: aichat
spec:
  template:
    spec:
      containers:
      - name: fastapi-app
        # 💡 1. イメージを自分のACR（Azure上のレジストリ）のURLに上書き
        # ※「aichatregistry2026」の部分はご自身のACR名に書き換えてください
        image: aichatregistry2026.azurecr.io/backend:latest

        # 💡 2. 本番環境なので、インターネットからイメージを毎回引っ張ってくるように設定
        imagePullPolicy: Always

        env:
        # 💡 3. 【超重要】Gemini APIキーは直書きせず、Azure Key Vaultから
        # 同期されてくる予定の「K8s Secret（名前: gemini-secret）」から安全に安全に読み込む
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-secret
              key: api-key

        # 💡 4. データベースの接続先URL
        - name: VECTORDB_URL
          value: "http://vectordb-service.aichat.svc.cluster.local:8000"
