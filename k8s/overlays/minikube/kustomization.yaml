apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 1. 大元（base）の設計図を読み込む
resources:
  - ../../base

# 2. Minikube環境だけで適用したい「上書き設定」
patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never

# 3. Minikube用のイメージ名を指定
images:
  - name: backend-image-placeholder
    newName: aichat
    newTag: latest
