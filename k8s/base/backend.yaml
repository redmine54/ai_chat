apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: aichat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: fastapi-app
        image: backend-image-placeholder # 👈 あとで上書きされます
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: aichat
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: backend
