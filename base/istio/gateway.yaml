# 外部からのHTTPSトラフィックを受け付ける設定
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: aichat-gateway
  namespace: aichat
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: aichat-tls
      hosts:
        - "*"
