<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ai_chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      :root {
        --bg-color: #faf8f5;
        --sidebar-bg: #f0ede9;
        --text-color: #333333;
        --accent-color: #8fa89b;
        --accent-hover: #768e82;
        --border-color: #d1cbc4;
        --white: #ffffff;
        --ai-bubble: #f0ede9;
        --user-bubble: #8fa89b;
        --user-text: #ffffff;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        line-height: 1.6;
        color: var(--text-color);
        background-color: var(--bg-color);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ヘッダー */
      .header {
        background-color: var(--white);
        border-bottom: 1px solid var(--border-color);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .header-title {
        font-size: 18px;
        font-weight: bold;
        color: var(--text-color);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .header-title i {
        color: var(--accent-color);
      }

      .header-links {
        display: flex;
        gap: 12px;
      }

      .header-link {
        padding: 6px 12px;
        background-color: var(--sidebar-bg);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        color: var(--text-color);
        text-decoration: none;
        font-size: 12px;
        transition: background-color 0.2s;
      }

      .header-link:hover {
        background-color: var(--border-color);
      }

      /* チャット履歴エリア */
      .chat-history {
        flex: 1;
        overflow-y: auto;
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* メッセージバブル */
      .message {
        display: flex;
        gap: 10px;
        max-width: 80%;
        animation: fadeIn 0.2s ease-in;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .message.ai { align-self: flex-start; }
      .message.user { align-self: flex-end; flex-direction: row-reverse; }

      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        flex-shrink: 0;
      }

      .ai .avatar {
        background-color: var(--accent-color);
        color: var(--white);
      }

      .user .avatar {
        background-color: var(--border-color);
        color: var(--text-color);
      }

      .bubble {
        padding: 10px 14px;
        border-radius: 12px;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .ai .bubble {
        background-color: var(--ai-bubble);
        border: 1px solid var(--border-color);
        border-top-left-radius: 2px;
      }

      .user .bubble {
        background-color: var(--user-bubble);
        color: var(--user-text);
        border-top-right-radius: 2px;
      }

      /* ローディングアニメーション */
      .typing {
        display: flex;
        gap: 4px;
        padding: 12px 14px;
      }

      .typing span {
        width: 8px;
        height: 8px;
        background-color: var(--accent-color);
        border-radius: 50%;
        animation: bounce 1.2s infinite;
      }

      .typing span:nth-child(2) { animation-delay: 0.2s; }
      .typing span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes bounce {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-6px); }
      }

      /* 入力エリア */
      .model-select-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        background: #f0ede9;
        border-top: 1px solid #d1cbc4;
        font-size: 13px;
        color: #555;
      }

      .model-select-bar select {
        padding: 4px 10px;
        border: 1px solid #d1cbc4;
        border-radius: 4px;
        font-size: 13px;
        background: #fff;
        color: #333;
        cursor: pointer;
      }

      .model-select-bar select:focus {
        outline: none;
        border-color: #8fa89b;
      }

      .input-area {
        background-color: var(--white);
        border-top: 1px solid var(--border-color);
        padding: 16px 20px;
        display: flex;
        gap: 10px;
        align-items: flex-end;
        flex-shrink: 0;
      }

      .input-wrapper {
        flex: 1;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        overflow: hidden;
        background-color: var(--bg-color);
        transition: border-color 0.2s;
      }

      .input-wrapper:focus-within {
        border-color: var(--accent-color);
      }

      #messageInput {
        width: 100%;
        padding: 10px 14px;
        border: none;
        outline: none;
        background-color: transparent;
        font-size: 14px;
        font-family: inherit;
        resize: none;
        max-height: 120px;
        min-height: 42px;
        line-height: 1.6;
      }

      .send-btn {
        width: 42px;
        height: 42px;
        background-color: var(--accent-color);
        color: var(--white);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.2s;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .send-btn:hover { background-color: var(--accent-hover); }
      .send-btn:disabled { background-color: #ccc; cursor: not-allowed; }

      /* ウェルカムメッセージ */
      .welcome {
        text-align: center;
        color: #888;
        margin: auto;
        padding: 40px 20px;
      }

      .welcome i {
        font-size: 48px;
        color: var(--accent-color);
        margin-bottom: 16px;
        display: block;
      }

      .welcome h2 {
        font-size: 18px;
        margin-bottom: 8px;
        color: var(--text-color);
      }

      .welcome p {
        font-size: 13px;
        color: #999;
      }
    </style>
  </head>
  <body>
        <nav style="background:#2c2c2c;padding:10px 20px;display:flex;gap:12px;align-items:center;">
      <span style="color:#aaa;font-size:13px;margin-right:8px;">🔗 メニュー:</span>
      <a href="/api/chat/ui" style="color:#fff;background:#4a90d9;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13px;">💬 チャット</a>
      <a href="/api/indexer" style="color:#fff;background:#4a90d9;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13px;">📄 PDFインデクサー</a>
      <a href="/api/specs" style="color:#fff;background:#4a90d9;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13px;">📚 ドキュメント</a>
      <a href="/swagger/docs" style="color:#fff;background:#4a90d9;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13px;">🔧 API</a>
      <a href="/api/utilities" style="color:#fff;background:#4a90d9;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13px;">🛠️ shユーティリティ</a>
    <a href="/api/ci" style="color:#fff;background:#4a90d9;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13px;">⚙️ CI結果</a>
    </nav>    <!-- ヘッダー -->
    <div class="header">
      <div class="header-title">
        <i class="fa-solid fa-robot"></i>
        ai_chat
      </div>
      <div class="header-links">
        <a href="/api/indexer" class="header-link">
          <i class="fa-solid fa-database"></i> PDFインデクサー
        </a>
        <a href="/api/specs" class="header-link">
          <i class="fa-solid fa-book"></i> ドキュメント
        </a>
      </div>
    </div>

    <!-- チャット履歴 -->
    <div class="chat-history" id="chatHistory">
      <div class="welcome" id="welcomeMsg">
        <i class="fa-solid fa-comments"></i>
        <h2>こんにちは！何でも聞いてください。</h2>
        <p>社内PDFドキュメントに基づいてAIが回答します。</p>
      </div>
    </div>

    <!-- モデル選択 -->
    <div class="model-select-bar">
      <label for="modelSelect"><i class="fa-solid fa-microchip"></i> モデル:</label>
      <select id="modelSelect">
        <option value="models/gemini-2.5-flash">gemini-2.5-flash</option>
        <option value="models/gemini-2.0-flash">gemini-2.0-flash</option>
        <option value="models/gemini-2.0-flash-lite">gemini-2.0-flash-lite</option>
        <option value="models/gemini-2.5-pro">gemini-2.5-pro</option>
      </select>
    </div>

    <!-- 入力エリア -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea
          id="messageInput"
          placeholder="質問を入力してください... （Enterで改行、送信ボタンで送信）"
          rows="1"
        ></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>

    <script>
      const chatHistory = document.getElementById('chatHistory');
      const messageInput = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendBtn');
      const welcomeMsg = document.getElementById('welcomeMsg');

      // テキストエリアの高さを自動調整
      messageInput.addEventListener('input', () => {
        messageInput.style.height = 'auto';
        messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
      });

      // 送信ボタンのみ送信（Enter・Shift+Enterは改行）
      // キーボードでは送信しない

      function addMessage(text, role) {
        // ウェルカムメッセージを非表示
        if (welcomeMsg) welcomeMsg.style.display = 'none';

        const div = document.createElement('div');
        div.className = `message ${role}`;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.innerHTML = role === 'ai'
          ? '<i class="fa-solid fa-robot"></i>'
          : '<i class="fa-solid fa-user"></i>';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        div.appendChild(avatar);
        div.appendChild(bubble);
        chatHistory.appendChild(div);
        chatHistory.scrollTop = chatHistory.scrollHeight;
        return bubble;
      }

      function addTyping() {
        if (welcomeMsg) welcomeMsg.style.display = 'none';
        const div = document.createElement('div');
        div.className = 'message ai';
        div.id = 'typing-indicator';

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.innerHTML = '<i class="fa-solid fa-robot"></i>';

        const bubble = document.createElement('div');
        bubble.className = 'bubble typing';
        bubble.innerHTML = '<span></span><span></span><span></span>';

        div.appendChild(avatar);
        div.appendChild(bubble);
        chatHistory.appendChild(div);
        chatHistory.scrollTop = chatHistory.scrollHeight;
      }

      function removeTyping() {
        const indicator = document.getElementById('typing-indicator');
        if (indicator) indicator.remove();
      }

      async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        // 送信ボタン無効化
        sendBtn.disabled = true;
        messageInput.value = '';
        messageInput.style.height = 'auto';

        // ユーザーメッセージ表示
        addMessage(text, 'user');

        // ローディング表示
        addTyping();

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, model: document.getElementById('modelSelect').value })
          });

          const data = await res.json();
          removeTyping();

          if (res.ok) {
            addMessage(data.answer, 'ai');
          } else {
            addMessage(`エラー: ${data.detail}`, 'ai');
          }
        } catch (e) {
          removeTyping();
          addMessage(`通信エラーが発生しました: ${e.message}`, 'ai');
        } finally {
          sendBtn.disabled = false;
          messageInput.focus();
        }
      }
    </script>
  </body>
</html>
