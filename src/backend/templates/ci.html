<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CI結果</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    :root { --bg-color:#faf8f5; --text-color:#333; --accent-color:#8fa89b; --accent-hover:#768e82; --border-color:#d1cbc4; --white:#fff; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:14px; color:var(--text-color); background:var(--bg-color); }
    h1 { font-size:20px; margin-bottom:8px; border-bottom:2px solid var(--accent-color); padding-bottom:10px; }
    .subtitle { color:#777; margin-bottom:20px; font-size:13px; }
    .content { padding:30px; max-width:1000px; }
    .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:20px; flex-wrap:wrap; }
    .btn { padding:6px 16px; background:var(--accent-color); color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:13px; }
    .btn:hover { background:var(--accent-hover); }
    .run-list { display:flex; flex-direction:column; gap:8px; }
    .run-card { background:var(--white); border:1px solid var(--border-color); border-radius:6px; overflow:hidden; }
    .run-header { display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; transition:background 0.2s; }
    .run-header:hover { background:#f5f2ee; }
    .run-status-icon { font-size:18px; min-width:24px; text-align:center; }
    .run-info { flex:1; min-width:0; }
    .run-title { font-weight:bold; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .run-meta { font-size:11px; color:#888; margin-top:2px; }
    .run-badge { font-size:11px; padding:2px 10px; border-radius:10px; font-weight:bold; white-space:nowrap; }
    .badge-success  { background:#e8f5e9; color:#2e7d32; }
    .badge-failure  { background:#ffebee; color:#c62828; }
    .badge-running  { background:#e3f2fd; color:#1565c0; }
    .badge-cancelled{ background:#f5f5f5; color:#757575; }
    .badge-skipped  { background:#f5f5f5; color:#9e9e9e; }
    .badge-none     { background:#f5f5f5; color:#9e9e9e; }
    .run-chevron { color:#aaa; transition:transform 0.2s; }
    .run-chevron.open { transform:rotate(90deg); }
    .run-detail { display:none; border-top:1px solid var(--border-color); padding:16px; background:#fdfcfb; }
    .run-detail.open { display:block; }
    .job-card { margin-bottom:12px; border:1px solid var(--border-color); border-radius:4px; overflow:hidden; }
    .job-header { display:flex; align-items:center; gap:10px; padding:10px 14px; background:#f0ede9; cursor:pointer; }
    .job-header:hover { background:#e8e4df; }
    .job-name { flex:1; font-size:13px; font-weight:bold; }
    .step-list { display:none; padding:8px 14px; }
    .step-list.open { display:block; }
    .step-row { display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid #f0ede9; font-size:12px; }
    .step-row:last-child { border-bottom:none; }
    .step-icon { min-width:16px; text-align:center; }
    .step-name { flex:1; color:#555; }
    /* 実行中ステップのログプレビュー */
    .step-log-preview {
      margin:4px 0 4px 26px; padding:8px 10px;
      background:#1e1e1e; border-radius:4px;
      font-family:monospace; font-size:11px; color:#f0f0f0;
      white-space:pre-wrap; word-break:break-all;
      max-height:120px; overflow-y:auto;
    }
    .step-log-preview .log-err  { color:#ff6b6b; }
    .step-log-preview .log-ok   { color:#69ff85; }
    .step-log-preview .log-info { color:#64d8ff; }
    /* ログモーダル */
    .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center; }
    .modal-overlay.active { display:flex; }
    .modal { background:#1e1e1e; border-radius:8px; width:900px; max-width:95vw; max-height:85vh; display:flex; flex-direction:column; }
    .modal-header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:#2d2d2d; border-radius:8px 8px 0 0; }
    .modal-title { color:#f0f0f0; font-size:13px; font-family:monospace; }
    .modal-close { background:#e53935; color:#fff; border:none; border-radius:50%; width:22px; height:22px; cursor:pointer; font-size:13px; }
    .log-area { flex:1; overflow-y:auto; padding:16px; font-family:monospace; font-size:12px; color:#f0f0f0; white-space:pre-wrap; word-break:break-all; max-height:70vh; }
    .log-err  { color:#ff6b6b; }
    .log-ok   { color:#69ff85; }
    .log-info { color:#64d8ff; }
    .modal-footer { padding:10px 16px; background:#2d2d2d; border-radius:0 0 8px 8px; display:flex; justify-content:flex-end; }
    .btn-close-modal { padding:6px 16px; background:#555; color:#fff; border:none; border-radius:4px; cursor:pointer; }
    .github-link { color:#4a90d9; text-decoration:none; font-size:12px; }
    .github-link:hover { text-decoration:underline; }
    .loading { color:#888; font-size:13px; padding:20px 0; }
    .auto-refresh-badge { font-size:11px; color:#1565c0; background:#e3f2fd; padding:2px 8px; border-radius:10px; }
  </style>
</head>
<body>
  <nav style="background:#2c2c2c;padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
    <span style="color:#aaa;font-size:13px;margin-right:8px;">🔗 メニュー:</span>
    <a href="/api/chat/ui" style="color:#fff;background:#4a90d9;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13px;">💬 チャット</a>
    <a href="/api/indexer" style="color:#fff;background:#4a90d9;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13px;">📄 PDFインデクサー</a>
    <a href="/api/specs" style="color:#fff;background:#4a90d9;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13px;">📚 ドキュメント</a>
    <a href="/swagger/docs" style="color:#fff;background:#4a90d9;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13px;">🔧 API</a>
    <a href="/api/utilities" style="color:#fff;background:#4a90d9;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13px;">🛠️ shユーティリティ</a>
    <a href="/api/ci" style="color:#fff;background:#4a90d9;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13px;">⚙️ CI結果</a>
  </nav>

  <div class="content">
    <h1><i class="fa-solid fa-circle-check"></i> CI結果</h1>
    <p class="subtitle">GitHub Actions の最新CI実行結果（リポジトリ: redmine54/ai_chat）</p>

    <div class="toolbar">
      <button class="btn" id="btnRefresh"><i class="fa-solid fa-rotate-right"></i> 更新</button>
      <span id="lastUpdated" style="font-size:12px;color:#888;"></span>
      <span id="autoRefreshBadge" class="auto-refresh-badge" style="display:none;"><i class="fa-solid fa-spinner fa-spin"></i> 自動更新中</span>
    </div>

    <div id="runList" class="run-list">
      <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> 読み込み中...</div>
    </div>
  </div>

  <!-- ログモーダル -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">ログ</span>
        <button class="modal-close" id="modalCloseBtn">✕</button>
      </div>
      <div class="log-area" id="logArea"></div>
      <div class="modal-footer">
        <button class="btn-close-modal" id="modalFooterBtn">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    var autoRefreshTimer = null;
    var openDetails = {};    // 開いているrun_idを記憶
    var openSteps = {};      // 開いているjob_idを記憶

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function conclusionIcon(conclusion, status) {
      if (status === 'in_progress') return '<i class="fa-solid fa-spinner fa-spin" style="color:#1565c0"></i>';
      switch(conclusion) {
        case 'success':   return '<i class="fa-solid fa-circle-check" style="color:#2e7d32"></i>';
        case 'failure':   return '<i class="fa-solid fa-circle-xmark" style="color:#c62828"></i>';
        case 'cancelled': return '<i class="fa-solid fa-ban" style="color:#757575"></i>';
        case 'skipped':   return '<i class="fa-solid fa-forward" style="color:#9e9e9e"></i>';
        default:          return '<i class="fa-solid fa-circle-minus" style="color:#9e9e9e"></i>';
      }
    }

    function conclusionBadge(conclusion, status) {
      if (status === 'in_progress') return '<span class="run-badge badge-running"><i class="fa-solid fa-spinner fa-spin"></i> 実行中</span>';
      switch(conclusion) {
        case 'success':   return '<span class="run-badge badge-success">✅ SUCCESS</span>';
        case 'failure':   return '<span class="run-badge badge-failure">❌ FAILURE</span>';
        case 'cancelled': return '<span class="run-badge badge-cancelled">⏹ CANCELLED</span>';
        case 'skipped':   return '<span class="run-badge badge-skipped">⏭ SKIPPED</span>';
        default:          return '<span class="run-badge badge-none">— ' + (conclusion || 'NONE') + '</span>';
      }
    }

    function formatDate(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleString('ja-JP');
    }

    function colorizeLog(text) {
      return text.split('\n').map(function(line) {
        var e = escHtml(line);
        if (e.match(/error|Error|FAILED|FAILURE/)) return '<span class="log-err">'+e+'</span>';
        if (e.match(/PASSED|passed|success|Success/)) return '<span class="log-ok">'+e+'</span>';
        if (e.match(/===|---|###/)) return '<span class="log-info">'+e+'</span>';
        return e;
      }).join('\n');
    }

    // ジョブ詳細をレンダリング（実行中ステップのログプレビュー付き）
    async function renderJobDetail(detailEl, runId, isInProgress) {
      try {
        var res = await fetch('/api/ci/runs/' + runId + '/jobs');
        var d = await res.json();
        if (!res.ok) throw new Error(d.detail);
        if (!d.jobs.length) { detailEl.innerHTML = '<div style="color:#888;font-size:13px;">ジョブ情報がありません</div>'; return; }

        var html = '';
        for (var ji = 0; ji < d.jobs.length; ji++) {
          var job = d.jobs[ji];
          var jobInProgress = job.status === 'in_progress';

          var stepsHtml = '';
          for (var si = 0; si < job.steps.length; si++) {
            var step = job.steps[si];
            var stepInProgress = step.status === 'in_progress';
            stepsHtml +=
              '<div class="step-row" id="step-' + runId + '-' + job.id + '-' + step.number + '">' +
                '<span class="step-icon">' + conclusionIcon(step.conclusion, step.status) + '</span>' +
                '<span class="step-name">' + escHtml(step.name) + '</span>' +
                conclusionBadge(step.conclusion, step.status) +
              '</div>';

            // 実行中ステップにはログプレビューを表示
            if (stepInProgress) {
              stepsHtml += '<div class="step-log-preview" id="log-preview-' + runId + '-' + job.id + '-' + step.number + '"><span style="color:#888">ログ取得中...</span></div>';
            }
          }

          var isStepOpen = openSteps[job.id] ? 'open' : '';
          html +=
            '<div class="job-card">' +
              '<div class="job-header" onclick="toggleSteps(this, ' + job.id + ')">' +
                '<span>' + conclusionIcon(job.conclusion, job.status) + '</span>' +
                '<span class="job-name">' + escHtml(job.name) + '</span>' +
                conclusionBadge(job.conclusion, job.status) +
                (job.conclusion === 'failure'
                  ? '<button class="btn" style="font-size:11px;padding:3px 10px;margin-left:8px;" onclick="event.stopPropagation();loadLog(' + runId + ',' + job.id + ',\'' + escHtml(job.name) + '\')"><i class="fa-solid fa-file-lines"></i> ログ</button>'
                  : '') +
                '<span style="color:#aaa;margin-left:4px;"><i class="fa-solid fa-chevron-right"></i></span>' +
              '</div>' +
              '<div class="step-list ' + isStepOpen + '" id="steps-' + job.id + '">' + stepsHtml + '</div>' +
            '</div>';
        }
        detailEl.innerHTML = html;

        // 実行中ステップのログプレビューを取得
        if (isInProgress) {
          for (var ji2 = 0; ji2 < d.jobs.length; ji2++) {
            var job2 = d.jobs[ji2];
            if (job2.status === 'in_progress') {
              openSteps[job2.id] = true;
              var stepsEl = document.getElementById('steps-' + job2.id);
              if (stepsEl) stepsEl.classList.add('open');
              for (var si2 = 0; si2 < job2.steps.length; si2++) {
                var step2 = job2.steps[si2];
                if (step2.status === 'in_progress') {
                  fetchLogPreview(runId, job2.id, step2.number);
                }
              }
            }
          }
        }
      } catch(e) {
        detailEl.innerHTML = '<div style="color:red;font-size:13px;">取得エラー: ' + e.message + '</div>';
      }
    }

    // ログプレビュー（最終10行）を取得
    async function fetchLogPreview(runId, jobId, stepNumber) {
      var previewEl = document.getElementById('log-preview-' + runId + '-' + jobId + '-' + stepNumber);
      if (!previewEl) return;
      try {
        var res = await fetch('/api/ci/runs/' + runId + '/logs/' + jobId);
        if (!res.ok) { previewEl.innerHTML = '<span style="color:#888">ログ取得にはGITHUB_TOKENが必要です</span>'; return; }
        var d = await res.json();
        var lines = d.logs.split('\n').filter(function(l) { return l.trim(); });
        var last10 = lines.slice(-10).join('\n');
        previewEl.innerHTML = colorizeLog(last10);
        previewEl.scrollTop = previewEl.scrollHeight;
      } catch(e) {
        previewEl.innerHTML = '<span style="color:#888">ログ取得失敗</span>';
      }
    }

    async function loadRuns() {
      if (autoRefreshTimer) { clearTimeout(autoRefreshTimer); autoRefreshTimer = null; }
      var list = document.getElementById('runList');

      // 初回のみローディング表示（自動更新時は既存表示を維持）
      if (!list.children.length || list.children[0].className === 'loading') {
        list.innerHTML = '<div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> 読み込み中...</div>';
      }

      try {
        var res = await fetch('/api/ci/runs');
        var d = await res.json();
        if (!res.ok) throw new Error(d.detail);
        if (!d.runs.length) { list.innerHTML = '<div class="loading">CI実行履歴がありません</div>'; return; }

        list.innerHTML = '';
        d.runs.forEach(function(run) {
          var isInProgress = run.status === 'in_progress';
          var isOpen = openDetails[run.id] || isInProgress;

          var card = document.createElement('div');
          card.className = 'run-card';
          card.innerHTML =
            '<div class="run-header" id="header-' + run.id + '" onclick="toggleDetail(this, ' + run.id + ')">' +
              '<span class="run-status-icon">' + conclusionIcon(run.conclusion, run.status) + '</span>' +
              '<div class="run-info">' +
                '<div class="run-title">' + escHtml(run.commit_msg || run.name) + '</div>' +
                '<div class="run-meta">' +
                  '<i class="fa-solid fa-code-branch"></i> ' + escHtml(run.branch) +
                  ' &nbsp;|&nbsp; <i class="fa-solid fa-code-commit"></i> ' + run.commit +
                  ' &nbsp;|&nbsp; <i class="fa-regular fa-clock"></i> ' + formatDate(run.created_at) +
                  ' &nbsp;|&nbsp; <a class="github-link" href="' + run.html_url + '" target="_blank" onclick="event.stopPropagation()"><i class="fa-brands fa-github"></i> GitHub</a>' +
                '</div>' +
              '</div>' +
              conclusionBadge(run.conclusion, run.status) +
              '<span class="run-chevron ' + (isOpen ? 'open' : '') + '"><i class="fa-solid fa-chevron-right"></i></span>' +
            '</div>' +
            '<div class="run-detail ' + (isOpen ? 'open' : '') + '" id="detail-' + run.id + '">' +
              '<div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> ジョブ読み込み中...</div>' +
            '</div>';
          list.appendChild(card);

          // 開いているdetailのジョブを取得
          if (isOpen) {
            renderJobDetail(document.getElementById('detail-' + run.id), run.id, isInProgress);
          }
        });

        document.getElementById('lastUpdated').textContent = '最終更新: ' + new Date().toLocaleTimeString('ja-JP');

        // in_progressがあれば10秒後に自動更新
        var hasInProgress = d.runs.some(function(r) { return r.status === 'in_progress'; });
        if (hasInProgress) {
          document.getElementById('autoRefreshBadge').style.display = 'inline';
          autoRefreshTimer = setTimeout(loadRuns, 10000);
        } else {
          document.getElementById('autoRefreshBadge').style.display = 'none';
        }
      } catch(e) {
        list.innerHTML = '<div class="loading" style="color:red">取得エラー: ' + e.message + '</div>';
      }
    }

    function toggleDetail(header, runId) {
      var chevron = header.querySelector('.run-chevron');
      var detail = document.getElementById('detail-' + runId);
      var isOpen = detail.classList.contains('open');

      if (isOpen) {
        detail.classList.remove('open');
        chevron.classList.remove('open');
        delete openDetails[runId];
      } else {
        detail.classList.add('open');
        chevron.classList.add('open');
        openDetails[runId] = true;
        renderJobDetail(detail, runId, false);
      }
    }

    function toggleSteps(header, jobId) {
      var stepList = document.getElementById('steps-' + jobId);
      if (!stepList) return;
      stepList.classList.toggle('open');
      if (stepList.classList.contains('open')) {
        openSteps[jobId] = true;
      } else {
        delete openSteps[jobId];
      }
    }

    async function loadLog(runId, jobId, jobName) {
      var logArea = document.getElementById('logArea');
      var overlay = document.getElementById('modalOverlay');
      document.getElementById('modalTitle').textContent = jobName;
      logArea.innerHTML = '<span style="color:#aaa">ログ読み込み中...</span>';
      overlay.classList.add('active');
      try {
        var res = await fetch('/api/ci/runs/' + runId + '/logs/' + jobId);
        var d = await res.json();
        if (!res.ok) { logArea.innerHTML = '<span class="log-err">エラー: ' + escHtml(d.detail) + '</span>'; return; }
        logArea.innerHTML = colorizeLog(d.logs);
        logArea.scrollTop = logArea.scrollHeight;
      } catch(e) {
        logArea.innerHTML = '<span class="log-err">取得エラー: ' + escHtml(e.message) + '</span>';
      }
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    document.getElementById('modalFooterBtn').addEventListener('click', closeModal);
    document.getElementById('btnRefresh').addEventListener('click', loadRuns);
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

    loadRuns();
  </script>
</body>
</html>
