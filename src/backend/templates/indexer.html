<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDFインデクサー</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      :root {
        --bg-color: #faf8f5;
        --sidebar-bg: #f0ede9;
        --text-color: #333333;
        --accent-color: #8fa89b;
        --accent-hover: #768e82;
        --border-color: #d1cbc4;
        --white: #ffffff;
        --success-color: #4caf50;
        --error-color: #e53935;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        line-height: 1.6;
        color: var(--text-color);
        background-color: var(--bg-color);
        padding: 40px;
      }

      h1 {
        font-size: 20px;
        margin-bottom: 8px;
        color: var(--text-color);
        border-bottom: 2px solid var(--accent-color);
        padding-bottom: 10px;
      }

      .subtitle {
        color: #777;
        margin-bottom: 30px;
        font-size: 13px;
      }

      .card {
        background: var(--white);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 24px;
        max-width: 700px;
        margin-bottom: 24px;
      }

      .card h2 {
        font-size: 15px;
        margin-bottom: 16px;
        border-left: 4px solid var(--accent-color);
        padding-left: 8px;
      }

      /* PDFリスト */
      #pdfList {
        list-style: none;
        margin-bottom: 16px;
      }

      #pdfList li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        margin-bottom: 8px;
        background-color: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 4px;
      }

      #pdfList li .filename {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #pdfList li .filename i {
        color: var(--accent-color);
      }

      .btn-index {
        padding: 6px 14px;
        background-color: var(--accent-color);
        color: var(--white);
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        transition: background-color 0.2s;
      }

      .btn-index:hover {
        background-color: var(--accent-hover);
      }

      .btn-index:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }

      /* ステータス表示 */
      .status-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: bold;
        margin-left: 8px;
      }

      .status-success {
        background-color: #e8f5e9;
        color: var(--success-color);
      }

      .status-error {
        background-color: #ffebee;
        color: var(--error-color);
      }

      .status-loading {
        background-color: #fff8e1;
        color: #f57f17;
      }

      /* ログエリア */
      #logArea {
        background-color: #1e1e1e;
        color: #d4d4d4;
        padding: 16px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
        min-height: 120px;
        max-height: 300px;
        overflow-y: auto;
        white-space: pre-wrap;
      }

      .log-success { color: #4caf50; }
      .log-error   { color: #e53935; }
      .log-info    { color: #90caf9; }

      /* リロードボタン */
      .btn-reload {
        padding: 6px 14px;
        background-color: var(--sidebar-bg);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        margin-bottom: 12px;
        transition: background-color 0.2s;
      }

      .btn-reload:hover { background-color: var(--border-color); }

      .empty-msg {
        color: #888;
        font-style: italic;
        padding: 10px 0;
      }
    </style>
  </head>
  <body>
    <nav style="background:#2c2c2c;padding:10px 20px;display:flex;gap:12px;align-items:center;">n      <span style="color:#aaa;font-size:13px;margin-right:8px;">🔗 メニュー:</span>n      <a href="/api/chat/ui" style="color:#fff;background:#4a90d9;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13px;">💬 チャット</a>n      <a href="/api/indexer" style="color:#fff;background:#4a90d9;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13px;">📄 PDFインデクサー</a>n      <a href="/api/specs" style="color:#fff;background:#4a90d9;border-radius:6px;padding:6px 14px;text-decoration:none;font-size:13px;">📚 ドキュメント</a>n    </nav>    <h1><i class="fa-solid fa-database"></i> PDFインデクサー</h1>
    <p class="subtitle">src/backend/data/ 配下のPDFをChromaDBにインデックス化します</p>

    <div class="card">
      <h2><i class="fa-solid fa-file-pdf"></i> 対象PDFファイル一覧</h2>
      <button class="btn-reload" onclick="loadPdfList()">
        <i class="fa-solid fa-rotate-right"></i> 一覧を更新
      </button>
      <ul id="pdfList">
        <li><span class="empty-msg">読み込み中...</span></li>
      </ul>
    </div>

    <div class="card">
      <h2><i class="fa-solid fa-terminal"></i> 実行ログ</h2>
      <div id="logArea">ログがここに表示されます。</div>
    </div>

    <script>
      const pdfList = document.getElementById('pdfList');
      const logArea = document.getElementById('logArea');

      function addLog(message, type = 'info') {
        const span = document.createElement('span');
        span.className = `log-${type}`;
        const time = new Date().toLocaleTimeString('ja-JP');
        span.textContent = `[${time}] ${message}\n`;
        logArea.appendChild(span);
        logArea.scrollTop = logArea.scrollHeight;
      }

      async function loadPdfList() {
        pdfList.innerHTML = '<li><span class="empty-msg">読み込み中...</span></li>';
        try {
          const res = await fetch('/api/pdf/list');
          const data = await res.json();

          if (data.files.length === 0) {
            pdfList.innerHTML = '<li><span class="empty-msg">PDFファイルが見つかりません</span></li>';
            return;
          }

          pdfList.innerHTML = '';
          data.files.forEach(filename => {
            const li = document.createElement('li');
            li.id = `file-${filename}`;
            li.innerHTML = `
              <span class="filename">
                <i class="fa-solid fa-file-pdf"></i>
                ${filename}
                <span class="status-badge" id="status-${filename}"></span>
              </span>
              <button class="btn-index" onclick="indexPdf('${filename}')" id="btn-${filename}">
                <i class="fa-solid fa-play"></i> インデックス化
              </button>
            `;
            pdfList.appendChild(li);
          });
          addLog(`${data.files.length}件のPDFファイルを検出しました`, 'info');
        } catch (e) {
          pdfList.innerHTML = '<li><span class="empty-msg" style="color:red;">読み込みに失敗しました</span></li>';
          addLog(`ファイル一覧の取得に失敗: ${e.message}`, 'error');
        }
      }

      async function indexPdf(filename) {
        const btn = document.getElementById(`btn-${filename}`);
        const status = document.getElementById(`status-${filename}`);

        btn.disabled = true;
        status.className = 'status-badge status-loading';
        status.textContent = '処理中...';
        addLog(`インデックス化開始: ${filename}`, 'info');

        try {
          const res = await fetch('/api/pdf/index', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename })
          });
          const data = await res.json();

          if (res.ok) {
            status.className = 'status-badge status-success';
            status.textContent = `✓ 完了 (${data.chunks}チャンク)`;
            addLog(`完了: ${filename} → ${data.chunks}チャンクをChromaDBに登録`, 'success');
          } else {
            status.className = 'status-badge status-error';
            status.textContent = 'エラー';
            addLog(`エラー: ${data.detail}`, 'error');
            btn.disabled = false;
          }
        } catch (e) {
          status.className = 'status-badge status-error';
          status.textContent = 'エラー';
          addLog(`通信エラー: ${e.message}`, 'error');
          btn.disabled = false;
        }
      }

      // 初期ロード
      window.addEventListener('DOMContentLoaded', loadPdfList);
    </script>
  </body>
</html>
