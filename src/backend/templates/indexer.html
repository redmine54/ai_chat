<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDFインデクサー</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      :root {
        --bg-color: #faf8f5;
        --sidebar-bg: #f0ede9;
        --text-color: #333333;
        --accent-color: #8fa89b;
        --accent-hover: #768e82;
        --border-color: #d1cbc4;
        --white: #ffffff;
        --success-color: #4caf50;
        --error-color: #e53935;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        line-height: 1.6;
        color: var(--text-color);
        background-color: var(--bg-color);
        padding: 40px;
      }

      h1 {
        font-size: 20px;
        margin-bottom: 8px;
        color: var(--text-color);
        border-bottom: 2px solid var(--accent-color);
        padding-bottom: 10px;
      }

      .subtitle {
        color: #777;
        margin-bottom: 30px;
        font-size: 13px;
      }

      .card {
        background: var(--white);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 24px;
        max-width: 700px;
        margin-bottom: 24px;
      }

      .card h2 {
        font-size: 15px;
        margin-bottom: 16px;
        border-left: 4px solid var(--accent-color);
        padding-left: 8px;
      }

      /* PDFリスト */
      #pdfList {
        list-style: none;
        margin-bottom: 16px;
      }

      #pdfList li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        margin-bottom: 8px;
        background-color: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 4px;
      }

      #pdfList li .filename {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #pdfList li .filename i {
        color: var(--accent-color);
      }

      .btn-index {
        padding: 6px 14px;
        background-color: var(--accent-color);
        color: var(--white);
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        transition: background-color 0.2s;
      }

      .btn-index:hover {
        background-color: var(--accent-hover);
      }

      .btn-index:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }

      /* ステータス表示 */
      .status-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: bold;
        margin-left: 8px;
      }

      .status-success {
        background-color: #e8f5e9;
        color: var(--success-color);
      }

      .status-error {
        background-color: #ffebee;
        color: var(--error-color);
      }

      .status-loading {
        background-color: #fff8e1;
        color: #f57f17;
      }

      /* ログエリア */
      #logArea {
        background-color: #1e1e1e;
        color: #d4d4d4;
        padding: 16px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
        min-height: 120px;
        max-height: 300px;
        overflow-y: auto;
        white-space: pre-wrap;
      }

      .log-success { color: #4caf50; }
      .log-error   { color: #e53935; }
      .log-info    { color: #90caf9; }

      /* リロードボタン */
      .btn-reload {
        padding: 6px 14px;
        background-color: var(--sidebar-bg);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        margin-bottom: 12px;
        transition: background-color 0.2s;
      }

      .btn-reload:hover { background-color: var(--border-color); }

      .empty-msg {
        color: #888;
        font-style: italic;
        padding: 10px 0;
      }
    
      .subtitle { color: #777; margin-bottom: 30px; font-size: 13px; }
      .card { background: #fff; border: 1px solid var(--border-color); border-radius: 6px; padding: 24px; max-width: 900px; margin-bottom: 24px; }
      .card h2 { font-size: 15px; margin-bottom: 16px; border-left: 4px solid var(--accent-color); padding-left: 8px; }
      h1 { font-size: 20px; margin-bottom: 8px; color: var(--text-color); border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; }
      #pdfList { list-style: none; margin: 16px 0; }
      #pdfList li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-bottom: 8px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 4px; flex-wrap: wrap; }
      #pdfList li .filename { flex: 1; display: flex; align-items: center; gap: 8px; font-weight: bold; }
      #pdfList li .filename i { color: var(--accent-color); }
      .file-info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .actions { display: flex; gap: 6px; }
      .meta { font-size: 12px; color: #888; }
      .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
      .badge-ok   { background: #e8f5e9; color: #2e7d32; }
      .badge-warn { background: #fff8e1; color: #f57f17; }
      .badge-none { background: #f5f5f5; color: #9e9e9e; }
      .btn-reload { padding: 6px 14px; background: var(--accent-color); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; margin-bottom: 12px; }
      .btn-index  { padding: 6px 12px; background: var(--accent-color); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
      .btn-warn   { background: #f57f17; }
      .btn-reindex { background: #5c7a70; }
      .btn-delete { padding: 6px 12px; background: #e53935; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
      .btn-index:hover { opacity: 0.85; } .btn-delete:hover { opacity: 0.85; }
      #logArea { background: #1e1e1e; color: #f0f0f0; padding: 16px; border-radius: 4px; font-size: 12px; min-height: 80px; max-height: 200px; overflow-y: auto; font-family: monospace; }
    </style>
  </head>
  <body>
    <nav style="background:#2c2c2c;padding:10px 20px;display:flex;gap:12px;align-items:center;">
      <span style="color:#aaa;font-size:13px;margin-right:8px;">🔗 メニュー:</span>
      <a href="/api/chat/ui" style="color:#fff;background:#4a90d9;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13px;">💬 チャット</a>
      <a href="/api/indexer" style="color:#fff;background:#4a90d9;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13px;">📄 PDFインデクサー</a>
      <a href="/api/specs" style="color:#fff;background:#4a90d9;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13px;">📚 ドキュメント</a>
      <a href="/swagger/docs" style="color:#fff;background:#4a90d9;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13px;">🔧 API</a>
      <a href="/api/utilities" style="color:#fff;background:#4a90d9;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13px;">🛠️ shユーティリティ</a>
    </nav>
    <div style="padding:40px;">
      <h1><i class="fa-solid fa-file-pdf"></i> PDFインデクサー</h1>
      <p class="subtitle">PDFファイルの登録状況確認・インデックス化・削除を行います</p>

      <div class="card">
        <h2><i class="fa-solid fa-list"></i> PDFファイル一覧</h2>
        <button class="btn-reload" onclick="loadPdfList()">
          <i class="fa-solid fa-rotate-right"></i> 一覧を更新
        </button>
        <ul id="pdfList"><li style="color:#999">読み込み中...</li></ul>
      </div>

      <div class="card">
        <h2><i class="fa-solid fa-terminal"></i> 実行ログ</h2>
        <div id="logArea">ログがここに表示されます。</div>
      </div>
    </div>

    <script>
      const logArea = document.getElementById("logArea");

      function log(msg, color) {
        const d = new Date().toLocaleTimeString("ja-JP");
        logArea.innerHTML += `<div style="color:${color||"#f0f0f0"}">${d} ${msg}</div>`;
        logArea.scrollTop = logArea.scrollHeight;
      }

      function statusBadge(status) {
        switch(status) {
          case "unregistered": return '<span class="badge badge-none">未登録</span>';
          case "registered":   return '<span class="badge badge-ok">登録済</span>';
          case "outdated":     return '<span class="badge badge-warn">要更新</span>';
          default:             return '<span class="badge badge-none">不明</span>';
        }
      }

      async function loadPdfList() {
        const list = document.getElementById("pdfList");
        list.innerHTML = '<li style="color:#999">読み込み中...</li>';
        try {
          const res = await fetch("/api/pdf/list");
          const data = await res.json();
          if (!data.files || data.files.length === 0) {
            list.innerHTML = '<li style="color:#999">PDFファイルが見つかりません</li>';
            return;
          }
          list.innerHTML = "";
          for (const filename of data.files) {
            const li = document.createElement("li");
            li.id = "file-" + filename;
            li.innerHTML = `<span class="filename"><i class="fa-solid fa-file-pdf"></i> ${filename}</span>
              <span class="file-info" id="info-${filename}">確認中...</span>
              <span class="actions" id="actions-${filename}"></span>`;
            list.appendChild(li);
            loadFileStatus(filename);
          }
        } catch(e) {
          list.innerHTML = '<li style="color:red">読み込みエラー</li>';
        }
      }

      async function loadFileStatus(filename) {
        try {
          const res = await fetch("/api/pdf/status?filename=" + encodeURIComponent(filename));
          const d = await res.json();
          const info = document.getElementById("info-" + filename);
          const actions = document.getElementById("actions-" + filename);

          const pageStr = d.page_count != null ? `${d.page_count}ページ` : "ページ数不明";
          const chunkStr = d.chunk_count > 0 ? `${d.chunk_count}チャンク` : "";
          const regDate = d.registered_at
            ? new Date(d.registered_at * 1000).toLocaleString("ja-JP")
            : "";

          info.innerHTML = `${statusBadge(d.status)}
            <span class="meta">${pageStr}${chunkStr ? " / " + chunkStr : ""}</span>
            ${regDate ? '<span class="meta">登録: ' + regDate + '</span>' : ""}`;

          let btns = "";
          if (d.status === "unregistered") {
            btns = `<button class="btn-index" onclick="indexPdf('${filename}', false)">
              <i class="fa-solid fa-plus"></i> 登録</button>`;
          } else if (d.status === "outdated") {
            btns = `<button class="btn-index btn-warn" onclick="indexPdf('${filename}', true)">
              <i class="fa-solid fa-rotate"></i> 更新</button>
              <button class="btn-delete" onclick="deletePdf('${d.document_id}', '${filename}')">
              <i class="fa-solid fa-trash"></i> 削除</button>`;
          } else {
            btns = `<button class="btn-index btn-reindex" onclick="indexPdf('${filename}', true)">
              <i class="fa-solid fa-rotate"></i> 再登録</button>
              <button class="btn-delete" onclick="deletePdf('${d.document_id}', '${filename}')">
              <i class="fa-solid fa-trash"></i> 削除</button>`;
          }
          actions.innerHTML = btns;
        } catch(e) {
          document.getElementById("info-" + filename).innerHTML = '<span style="color:red">取得失敗</span>';
        }
      }

      async function indexPdf(filename, force) {
        const actions = document.getElementById("actions-" + filename);
        actions.innerHTML = '<span style="color:#888"><i class="fa-solid fa-spinner fa-spin"></i> 処理中...</span>';
        log(`インデックス化開始: ${filename}`, "#64d8ff");
        try {
          const res = await fetch("/api/pdf/index", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({filename, force})
          });
          const d = await res.json();
          if (d.status === "success") {
            log(`✅ 完了: ${filename} (${d.chunks}チャンク)`, "#69ff85");
          } else {
            log(`❌ エラー: ${d.detail}`, "#ff6b6b");
          }
        } catch(e) {
          log(`❌ エラー: ${e}`, "#ff6b6b");
        }
        loadFileStatus(filename);
      }

      async function deletePdf(documentId, filename) {
        if (!confirm(`"${filename}" の登録データを削除しますか？`)) return;
        log(`削除開始: ${filename}`, "#64d8ff");
        try {
          const res = await fetch("/api/pdf/delete", {
            method: "DELETE",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({document_id: documentId})
          });
          const d = await res.json();
          if (d.status === "success") {
            log(`✅ 削除完了: ${filename} (${d.deleted_chunks}チャンク削除)`, "#69ff85");
          } else {
            log(`❌ エラー: ${d.detail}`, "#ff6b6b");
          }
        } catch(e) {
          log(`❌ エラー: ${e}`, "#ff6b6b");
        }
        loadFileStatus(filename);
      }

      window.onload = loadPdfList;
    </script>
  </body>
</html>
