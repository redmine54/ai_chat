server {
    listen 80;

    root /usr/share/nginx/html;

    location /swagger/ {
        proxy_pass http://backend:8000/swagger/;
    }


    # /api/specs → backend:8000/api/specs
    location /api/specs {
        proxy_pass http://backend:8000/api/specs;
    }

    location /api/docs/ {
        proxy_pass http://backend:8000/api/docs/;
    }

    location /api/root_meta/ {
        proxy_pass http://backend:8000/api/root_meta/;
    }

    # その他の /api/ は backend に流す
    location /api/ {
    #    proxy_pass http://backend:8000/;
        proxy_pass http://backend:8000/api/;  # ← /api/ を保持する
    }
    location = /favicon.ico {
        return 204;
    }

    location / {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


    location /favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
    }
}
