name: CI

on:
  push:
    branches: [ feature/** ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --no-cache -t aichat:latest \
            -f src/backend/Dockerfile \
            .

      - name: Run unit tests
        run: |
          docker run --rm aichat:latest python -m pytest tests/unit/ -v || \
          echo "⚠️ テストコードがありません（tests/unit/）"

      - name: Run integration tests
        run: |
          docker run --rm aichat:latest python -m pytest tests/integration/ -v || \
          echo "⚠️ テストコードがありません（tests/integration/）"

      - name: Validate K8s manifests
        run: |
          kubectl apply --dry-run=client -f k8s/
