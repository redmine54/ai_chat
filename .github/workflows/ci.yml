name: CI

on:
  push:
    branches: [feature/**]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: true
        default: "ci_only"
        type: choice
        options:
          - ci_only
          - ci_then_cd
          - cd_only

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPLOY_ENV: compose
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  ci:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      # 0) 実行情報の表示
      - name: Show execution info
        run: |
          echo "==============================="
          echo "🚀 CI実行情報"
          echo "==============================="
          echo "実行モード : ${{ github.event.inputs.mode || 'push (自動)' }}"
          echo "ブランチ   : ${{ github.ref_name }}"
          echo "実行者     : ${{ github.actor }}"
          echo "開始時刻   : $(date '+%Y-%m-%d %H:%M:%S')"
          echo "コミット   : ${{ github.sha }}"
          echo "==============================="

      # 1) パーミッション修正
      - name: Fix permissions
        run: |
          sudo chmod -R 777 ~/git_lesson/ai_chat/actions-runner/_work/ai_chat/ai_chat || true
          sudo rm -rf ~/git_lesson/ai_chat/actions-runner/_work/ai_chat/ai_chat/src/backend/data || true
          sudo rm -rf ~/git_lesson/ai_chat/actions-runner/_work/ai_chat/ai_chat/src/backend/docs || true
          sudo rm -rf ~/git_lesson/ai_chat/actions-runner/_work/ai_chat/ai_chat/src/backend/tests || true

      # 2) コード取得
      - name: Checkout code
        uses: actions/checkout@v4

      # 3) 古いDockerコンテナのクリーンアップ
      - name: Cleanup old Docker containers
        if: github.event.inputs.mode != 'cd_only'
        run: docker container prune -f || true

      # 4) 不要なボリュームを削除してディスク節約
      - name: Cleanup old Docker volumes
        if: github.event.inputs.mode != 'cd_only'
        run: docker volume prune -f || true

      # 5) 中間イメージも含めて完全クリーンアップ
      - name: Cleanup ALL Docker images (including intermediate)
        if: github.event.inputs.mode != 'cd_only'
        run: docker system prune -af || true

      # 6) Docker Compose で backend をビルド
      - name: Build backend image
        run: docker compose build backend

      # 7) ビルドされたイメージ名を確認
      - name: List Docker images
        run: docker images | grep -i backend

      # 8) Dockerコンテキストを確認
      - name: Check Docker context
        run: |
          docker context ls
          echo "DOCKER_HOST=$DOCKER_HOST"

      # 9) 依存関係インストール（cd_only はスキップ）
      - name: Install dependencies
        if: github.event.inputs.mode != 'cd_only'
        run: docker compose run --rm backend pip install -r requirements.txt

      # 10) ruff のバージョン確認（cd_only はスキップ）
      - name: Check ruff version
        if: github.event.inputs.mode != 'cd_only'
        run: docker compose run --rm backend ruff --version

      # 11) フォーマットチェック（cd_only はスキップ）
      - name: Run Format Check (ruff fmt)
        if: github.event.inputs.mode != 'cd_only'
        run: docker compose run --rm backend ruff format --check .

      # 12) Lint チェック（cd_only はスキップ）
      - name: Run Lint (ruff)
        if: github.event.inputs.mode != 'cd_only'
        run: docker compose run --rm backend ruff check .

      # 13) 型チェック（cd_only はスキップ）
      - name: Run Type Check (mypy)
        if: github.event.inputs.mode != 'cd_only'
        run: docker compose run --rm backend mypy .

      # 14) Unit Test（cd_only はスキップ）
      - name: Run unit tests with coverage
        if: github.event.inputs.mode != 'cd_only'
        run: |
          docker compose run --rm backend pytest tests/unit/ -v \
            --cov=app --cov-report=xml --cov-report=term || \
            echo "⚠️ Unit test がありません"

      # 15) coverage.xml をコンテナからホストにコピー（cd_only はスキップ）
      - name: Copy coverage report from container
        if: github.event.inputs.mode != 'cd_only'
        run: |
          docker compose run --rm backend cat /app/coverage.xml > coverage.xml || true

      # 16) coverage.xml を GitHub Actions のアーティファクトとして保存（cd_only はスキップ）
      - name: Upload coverage report
        if: github.event.inputs.mode != 'cd_only'
        continue-on-error: true
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      # 16-1) アップロード結果の表示
      - name: Upload coverage report result
        if: github.event.inputs.mode != 'cd_only'
        run: |
          if [ "${{ steps.upload.outcome }}" == "success" ]; then
            echo "✅ coverage.xml のアップロードが完了しました。"
          else
            echo "⚠️ coverage.xml のアップロードに失敗しました。CIは続行します。"
          fi

      # 17) Integration Test（cd_only はスキップ）
      - name: Run integration tests without coverage
        if: github.event.inputs.mode != 'cd_only'
        run: |
          docker compose run --rm backend pytest tests/integration/ -v || \
          echo "⚠️ Integration test がありません"

      # 18) Docker イメージ脆弱性チェック（Trivy）
      - name: Security Scan (Trivy:Docker イメージ脆弱性チェック)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $PWD/.trivyignore:/.trivyignore \
            aquasec/trivy:latest image \
            --ignorefile /.trivyignore \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --format table \
            ai_chat-backend:latest && \
          echo "✅ Dockerの脆弱性検査は正常に終了しました。脆弱性は検出されませんでした。" || \
          echo "✅ Dockerの脆弱性検査は正常に終了しました。但し、脆弱性が検出されています。詳細は上記のレポートを参照してください。対応: .trivyignoreに未対応のCVEを追加するか、該当パッケージのアップグレードを検討してください。"

      # 19) K8s 検証（compose の場合はスキップ）
      - name: Skip K8s validation (compose)
        if: env.DEPLOY_ENV == 'compose' && github.event.inputs.mode != 'cd_only'
        run: echo "compose モードのため K8s 検証をスキップ"

      # 20) minikube 環境の場合のみ K8s マニフェストを検証
      - name: Validate K8s manifests (minikube)
        if: env.DEPLOY_ENV == 'minikube' && github.event.inputs.mode != 'cd_only'
        run: |
          minikube start || true
          find k8s/ -name "*.yaml" ! -name "kustomization.yaml" | \
            xargs kubectl apply --dry-run=client --validate=false -f

      # 21) AKS 環境の場合のみ K8s マニフェストを検証
      - name: Validate K8s manifests (aks)
        if: env.DEPLOY_ENV == 'aks' && github.event.inputs.mode != 'cd_only'
        run: |
          find k8s/ -name "*.yaml" ! -name "kustomization.yaml" | \
            xargs kubectl apply --dry-run=client --validate=false -f

      # 22) デプロイ（ci_then_cd または cd_only の場合のみ実行）
      - name: Deploy
        if: github.event.inputs.mode == 'ci_then_cd' || github.event.inputs.mode == 'cd_only'
        run: |
          docker compose up -d
          echo "✅ デプロイ完了"
          docker compose ps
